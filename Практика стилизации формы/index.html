    <form class="form">
      <fieldset class="form-group">
        <legend class="form-group-title">Ваши личные данные</legend>
        <label for="name" class="label">Ваше имя</label>
        <input
          type="text"
          class="input"
          id="name"
          placeholder="Имя"
          name="name"
          required
        />
        <label for="age" class="label">Ваш возраст</label>
        <input
          type="number"
          class="input"
          id="age"
          placeholder="Возраст"
          name="age"
          required
        />
        <label for="phone" class="label">Ваш номер телефона</label>
        <input
          type="tel"
          class="input"
          id="phone"
          inputmode="numeric"
          placeholder="Номер телефона"
          name="phone"
          required
        />
        <label for="name" class="label">Ваша почта</label>
        <input
          type="email"
          class="input"
          id="email"
          placeholder="Почта"
          name="email"
          required
        />
      </fieldset>
      <fieldset class="form-group">
        <label for="message" class="label">Сообщение</label>
        <textarea
          name="message"
          id="message"
          class="textarea"
          placeholder="Ваше сообщение"
          required
        ></textarea>
        <label class="label checkbox-label">
          <input type="checkbox" name="checkbox" class="checkbox" required />
          <span class="checkbox-text">Я принимаю правила</span>
        </label>
      </fieldset>
      <button class="button">Отправить</button>
    </form>
